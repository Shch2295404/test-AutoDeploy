name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image-ref.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export image ref for deploy
        id: image-ref
        run: |
          lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${lower}:latest" >> "$GITHUB_OUTPUT"

  # Опционально (⭐): в Settings → Secrets → Actions задайте HOST, USERNAME, SSH_KEY, PORT;
  # в Settings → Variables → Actions создайте ENABLE_SSH_DEPLOY=true, иначе job пропускается (сборка в GHCR всё равно выполняется).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.ENABLE_SSH_DEPLOY == 'true'
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_IMAGE: ${{ needs.build.outputs.image }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || '22' }}
          envs: DEPLOY_IMAGE,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            docker stop vpe04-time-api 2>/dev/null || true
            docker rm vpe04-time-api 2>/dev/null || true
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull "$DEPLOY_IMAGE"
            docker run -d --name vpe04-time-api --restart unless-stopped -p 8000:8000 "$DEPLOY_IMAGE"
